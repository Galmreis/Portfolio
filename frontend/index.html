<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reis — Portfolio</title>
    <meta name="description" content="Portfolio of Reis — Web Development and Systems Analysis student in Brazil. React, Node.js, and the projects I build while learning." />
    <!-- Domínio provisório. Trocar aqui e nas tags og: abaixo quando o
         site tiver endereço de verdade. Scraper não resolve URL relativa,
         então domínio errado aqui significa nenhuma imagem de preview. -->
    <link rel="canonical" href="https://reis-portfolio.vercel.app/" />

    <meta name="theme-color" content="#0a0c11" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f4f6fa" media="(prefers-color-scheme: light)" />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/favicon.svg" />

    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://reis-portfolio.vercel.app/" />
    <meta property="og:title" content="Reis — Web Development" />
    <meta property="og:description" content="Learning to build things that stay useful. React, Node.js, and the projects I ship while I learn." />
    <meta property="og:image" content="https://reis-portfolio.vercel.app/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <!-- Roda ANTES do primeiro paint, que é o ponto: o React monta um ou
         dois quadros depois, e até lá a página já teria piscado branco em
         quem escolheu escuro. Aqui só lê, nunca escreve. -->
    <script>
      try {
        var saved = localStorage.getItem('theme')
        var light = saved
          ? saved === 'light'
          : matchMedia('(prefers-color-scheme: light)').matches
        document.documentElement.dataset.theme = light ? 'light' : 'dark'
      } catch (e) {
        document.documentElement.dataset.theme = 'dark'
      }
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
