<!doctype html><html><head><meta charset="utf-8">
<!-- Fonte do frontend/public/og.png, a imagem que aparece quando o link do
     site é colado no LinkedIn ou no WhatsApp. É imagem e não página porque
     esses scrapers não rodam JavaScript. Trocou o headline no site, troca
     aqui e reexporta:

       firefox --headless --screenshot "$PWD/frontend/public/og.png" \
               --window-size=1200,630 "file://$PWD/assets/og-source.html"

     As cores estão escritas na mão porque este arquivo abre direto do
     disco, sem build. -->
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&display=block" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0}
  html,body{width:1200px;height:630px;overflow:hidden}
  body{
    background:#0a0c11;color:#c8cedb;
    font-family:'JetBrains Mono',ui-monospace,monospace;
    padding:66px 76px;display:flex;flex-direction:column;justify-content:space-between;
    position:relative;
  }
  body::before{
    content:'';position:absolute;inset:0;
    background-image:linear-gradient(to right,rgba(200,206,219,.07) 1px,transparent 1px);
    background-size:56px 100%;
  }
  body::after{
    content:'';position:absolute;inset:0;
    background:repeating-linear-gradient(to bottom,rgba(0,0,0,.055) 0 1px,transparent 1px 3px),
               radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.35) 100%);
  }
  .row{position:relative;z-index:1}
  .cmd{font-size:24px;color:#7d8799;letter-spacing:.01em}
  .cmd b{color:#ff4d29;font-weight:500}
  .cmd i{color:#7aa2f7;font-style:normal}
  h1{
    font-size:76px;line-height:1.18;font-weight:700;color:#eef1f7;
    letter-spacing:-.02em;max-width:17ch;margin-top:34px;
  }
  h1 em{
    font-style:normal;color:#ff4d29;
    background:rgba(255,77,41,.13);padding:0 .12em;
    box-decoration-break:clone;-webkit-box-decoration-break:clone;
  }
  .meta{display:flex;gap:44px;font-size:23px;color:#7d8799;align-items:center}
  .meta b{color:#c8cedb;font-weight:400}
  .meta .dot{width:9px;height:9px;border-radius:50%;background:#ff4d29;box-shadow:0 0 12px #ff4d29}
  .rule{height:1px;background:#1d2230;margin-bottom:24px}
</style></head><body>
  <div class="row">
    <p class="cmd"><b>reis@portfolio</b><i>:~</i><b>$</b> whoami</p>
    <h1>Learning to build things <em>that stay useful.</em></h1>
  </div>
  <div class="row">
    <div class="rule"></div>
    <div class="meta">
      <span class="dot"></span>
      <span><b>Reis</b> — Web Development</span>
      <span>Brazil</span>
      <span>github.com/<b>Galmreis</b></span>
    </div>
  </div>
</body></html>
